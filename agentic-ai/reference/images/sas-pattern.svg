<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Arial, sans-serif">
  <!-- 배경 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="supervisorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="schedulerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="agentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="toolGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- 배경 사각형 -->
  <rect x="0" y="0" width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- 제목 -->
  <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e293b">
    SAS 패턴 기반 멀티에이젼트 아키텍처
  </text>
  
  <!-- Supervisor -->
  <g filter="url(#shadow)">
    <rect x="300" y="70" width="200" height="60" rx="10" fill="url(#supervisorGrad)"/>
    <text x="400" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Supervisor</text>
    <text x="400" y="118" text-anchor="middle" font-size="11" fill="white">상태 모니터링 / 장애 복구</text>
  </g>
  
  <!-- Supervisor -> Scheduler 화살표 -->
  <line x1="400" y1="130" x2="400" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="450" y="150" font-size="10" fill="#64748b">모니터링</text>
  
  <!-- Scheduler -->
  <g filter="url(#shadow)">
    <rect x="300" y="170" width="200" height="60" rx="10" fill="url(#schedulerGrad)"/>
    <text x="400" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Scheduler</text>
    <text x="400" y="218" text-anchor="middle" font-size="11" fill="white">작업 분배 및 조율 (Orchestrator)</text>
  </g>
  
  <!-- 수평적 통신 레이블 -->
  <rect x="250" y="250" width="300" height="24" rx="4" fill="#dbeafe"/>
  <text x="400" y="266" text-anchor="middle" font-size="11" fill="#1e40af">
    수평적 통신: MCP, A2A, Function Calling, API
  </text>
  
  <!-- Scheduler -> Agents 화살표들 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
  </defs>
  
  <path d="M 350 230 L 350 250 L 180 250 L 180 300" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="230" x2="400" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 450 230 L 450 250 L 620 250 L 620 300" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Agent A -->
  <g filter="url(#shadow)">
    <rect x="100" y="300" width="160" height="70" rx="10" fill="url(#agentGrad)"/>
    <text x="180" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Agent A</text>
    <text x="180" y="350" text-anchor="middle" font-size="10" fill="white">수집 Agent</text>
  </g>
  
  <!-- Agent B -->
  <g filter="url(#shadow)">
    <rect x="320" y="300" width="160" height="70" rx="10" fill="url(#agentGrad)"/>
    <text x="400" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Agent B</text>
    <text x="400" y="350" text-anchor="middle" font-size="10" fill="white">분석 Agent</text>
  </g>
  
  <!-- Agent C -->
  <g filter="url(#shadow)">
    <rect x="540" y="300" width="160" height="70" rx="10" fill="url(#agentGrad)"/>
    <text x="620" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Agent C</text>
    <text x="620" y="350" text-anchor="middle" font-size="10" fill="white">리포트 Agent</text>
  </g>
  
  <!-- Agent 간 통신 (양방향 화살표) -->
  <line x1="260" y1="335" x2="320" y2="335" stroke="#10b981" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="480" y1="335" x2="540" y2="335" stroke="#10b981" stroke-width="2" stroke-dasharray="5,3"/>
  
  <!-- Agent간 통신 레이블 -->
  <rect x="250" y="385" width="300" height="24" rx="4" fill="#d1fae5"/>
  <text x="400" y="401" text-anchor="middle" font-size="11" fill="#065f46">
    Agent간 수평적 통신: MCP, A2A, Function Calling, API
  </text>
  
  <!-- 수직적 통신 레이블 -->
  <rect x="250" y="420" width="300" height="24" rx="4" fill="#ede9fe"/>
  <text x="400" y="436" text-anchor="middle" font-size="11" fill="#5b21b6">
    수직적 통신: Function Calling, MCP
  </text>
  
  <!-- Agents -> Tools 화살표들 -->
  <line x1="180" y1="370" x2="180" y2="470" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="370" x2="400" y2="470" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="620" y1="370" x2="620" y2="470" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 외부 시스템 박스 -->
  <g filter="url(#shadow)">
    <rect x="80" y="480" width="640" height="70" rx="10" fill="url(#toolGrad)"/>
    <text x="400" y="510" text-anchor="middle" font-size="16" font-weight="bold" fill="white">외부 시스템</text>
    <text x="400" y="535" text-anchor="middle" font-size="12" fill="white">도구 / 데이터베이스 / API / Code Execution</text>
  </g>
  
  
  <!-- 통신 방식 범례 -->
  <g transform="translate(650, 70)">
    <text x="0" y="0" font-size="11" font-weight="bold" fill="#1e293b">통신 방식</text>
    <line x1="0" y1="15" x2="30" y2="15" stroke="#64748b" stroke-width="2"/>
    <text x="35" y="19" font-size="9" fill="#1e293b">동기/비동기</text>
    <line x1="0" y1="35" x2="30" y2="35" stroke="#10b981" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="35" y="39" font-size="9" fill="#1e293b">Agent 협업</text>
  </g>
  
</svg>
