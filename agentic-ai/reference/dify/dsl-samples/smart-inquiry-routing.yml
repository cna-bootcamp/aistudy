            type: string
          estimated_time:
            children: null
            type: string
          summary:
            children: null
            type: string
          classification_reason:
            children: null
            type: string
        selected: false
        title: JSON 파싱
        type: code
        variables:
        - value_selector:
          - '2'
          - text
          variable: llm_output
