    - data:
        desc: '처리 결과를 로그 형식으로 정리'
        selected: false
        template: |
          ## 문의 처리 로그

          - 문의 제목: {{ inquiry_title }}
          - 분류: {{ major_category }} > {{ mid_category }}{% if minor_category %} > {{ minor_category }}{% endif %}
          - 신뢰도: {{ confidence }}%
          - 우선순위: {{ priority }}
          - 배정팀: {{ assigned_team }}
          - 예상 처리 시간: {{ estimated_time }}
