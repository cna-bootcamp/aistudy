    - data:
        code: |
          import json

          def main(llm_output: str) -> dict:
              try:
                  clean = llm_output.strip()
                  if clean.startswith('```'):
                      clean = clean.split('\n', 1)[1] if '\n' in clean else clean[3:]
                      if clean.endswith('```'):
                          clean = clean[:-3]
                      clean = clean.strip()
                  result = json.loads(clean)
                  return {
                      "major_category": str(result.get("major_category", "기타")),
                      "mid_category": str(result.get("mid_category", "미분류")),
                      "minor_category": str(result.get("minor_category", "")),
                      "confidence": int(result.get("confidence", 0)),
                      "priority": str(result.get("priority", "보통")),
                      "assigned_team": str(result.get("assigned_team", "CS관리팀")),
                      "estimated_time": str(result.get("estimated_time", "24시간 이내")),
                      "summary": str(result.get("summary", "")),
                      "classification_reason": str(result.get("classification_reason", ""))
                  }
              except (json.JSONDecodeError, ValueError, KeyError):
                  return {
                      "major_category": "기타",
                      "mid_category": "미분류",
                      "minor_category": "",
                      "confidence": 0,
                      "priority": "보통",
                      "assigned_team": "CS관리팀",
                      "estimated_time": "24시간 이내",
                      "summary": "JSON 파싱 실패",
                      "classification_reason": "LLM 응답 파싱 오류"
                  }
        code_language: python3
        desc: 'LLM 응답 JSON을 파싱하여 개별 변수로 분리'
        outputs:
          major_category:
            children: null
            type: string
          mid_category:
            children: null
            type: string
          minor_category:
            children: null
            type: string
          confidence:
