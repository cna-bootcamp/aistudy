<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNN RGB 채널 합성곱 연산 시각화</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .cell {
            transition: all 0.3s ease;
        }
        .highlight {
            animation: pulse 1.5s infinite;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }
        .slide-highlight {
            border: 3px solid #f59e0b !important;
            background-color: rgba(245, 158, 11, 0.3) !important;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 p-4">
    <div class="max-w-6xl mx-auto">
        <!-- 헤더 -->
        <div class="text-center mb-4">
            <h1 class="text-2xl font-bold text-gray-800 mb-1">
                🧠 CNN RGB 채널 합성곱 연산 시각화
            </h1>
            <p class="text-sm text-gray-600">하나의 필터가 모든 채널을 동시에 처리합니다</p>
        </div>

        <!-- 단계 네비게이션 -->
        <div class="flex justify-center gap-2 mb-4 flex-wrap" id="stepButtons">
            <button onclick="setStep(0)" class="step-btn px-3 py-2 rounded-lg text-sm font-medium bg-indigo-600 text-white shadow-lg">1단계</button>
            <button onclick="setStep(1)" class="step-btn px-3 py-2 rounded-lg text-sm font-medium bg-white text-gray-600 hover:bg-indigo-100">2단계</button>
            <button onclick="setStep(2)" class="step-btn px-3 py-2 rounded-lg text-sm font-medium bg-white text-gray-600 hover:bg-indigo-100">3단계</button>
            <button onclick="setStep(3)" class="step-btn px-3 py-2 rounded-lg text-sm font-medium bg-white text-gray-600 hover:bg-indigo-100">4단계</button>
            <button onclick="setStep(4)" class="step-btn px-3 py-2 rounded-lg text-sm font-medium bg-white text-gray-600 hover:bg-indigo-100">5단계</button>
            <button onclick="setStep(5)" class="step-btn px-3 py-2 rounded-lg text-sm font-medium bg-white text-gray-600 hover:bg-indigo-100">6단계</button>
        </div>

        <!-- 현재 단계 설명 -->
        <div class="bg-white rounded-xl shadow-lg p-4 mb-4 text-center">
            <h2 id="stepTitle" class="text-lg font-bold text-indigo-700">1단계: RGB 입력</h2>
            <p id="stepDesc" class="text-gray-600">4×4×3 크기의 RGB 이미지가 입력됩니다</p>
        </div>

        <!-- 메인 시각화 영역 -->
        <div class="bg-white rounded-xl shadow-lg p-6" id="mainContent">
            <!-- JavaScript로 동적 렌더링 -->
        </div>

        <!-- 전체 구조 요약 -->
        <div class="mt-6 bg-white rounded-xl shadow-lg p-6">
            <h3 class="text-lg font-bold text-center text-gray-700 mb-4">📊 전체 구조 요약</h3>
            <div class="flex items-center justify-center gap-4 flex-wrap">
                <div class="text-center p-3 bg-gray-100 rounded-lg">
                    <div class="font-bold text-gray-700">입력</div>
                    <div class="text-2xl font-mono">4×4×3</div>
                    <div class="text-xs text-gray-500">H × W × C</div>
                </div>
                <div class="text-2xl text-gray-400">→</div>
                <div class="text-center p-3 bg-indigo-100 rounded-lg">
                    <div class="font-bold text-indigo-700">필터 1개</div>
                    <div class="text-2xl font-mono">3×3×3</div>
                    <div class="text-xs text-indigo-500">K × K × C</div>
                </div>
                <div class="text-2xl text-gray-400">→</div>
                <div class="text-center p-3 bg-yellow-100 rounded-lg">
                    <div class="font-bold text-yellow-700">특성맵</div>
                    <div class="text-2xl font-mono">2×2×1</div>
                    <div class="text-xs text-yellow-600">(no padding)</div>
                </div>
            </div>
            <div class="text-center mt-4 p-3 bg-green-50 rounded-lg border border-green-200">
                <p class="text-green-800">
                    <strong>필터 N개 사용 시:</strong> 출력 크기 = 2×2×<strong>N</strong>
                </p>
            </div>
        </div>
    </div>

    <script>
        // 데이터 정의
        const inputR = [
            [120, 130, 125, 140],
            [135, 145, 150, 130],
            [140, 155, 160, 145],
            [130, 140, 135, 150]
        ];
        
        const inputG = [
            [80, 85, 90, 75],
            [95, 100, 105, 90],
            [100, 110, 115, 105],
            [90, 95, 100, 110]
        ];
        
        const inputB = [
            [50, 55, 60, 45],
            [65, 70, 75, 60],
            [70, 80, 85, 75],
            [60, 65, 70, 80]
        ];

        const filterR = [[1, 0, -1], [1, 0, -1], [1, 0, -1]];
        const filterG = [[1, 0, -1], [2, 0, -2], [1, 0, -1]];
        const filterB = [[0, 1, 0], [1, -4, 1], [0, 1, 0]];
        const bias = 10;

        const steps = [
            { title: "1단계: RGB 입력", desc: "4×4×3 크기의 RGB 이미지가 입력됩니다" },
            { title: "2단계: 3D 필터", desc: "필터도 3×3×3 크기로 각 채널에 대응합니다" },
            { title: "3단계: R채널 연산", desc: "필터의 R부분 × 입력 R채널" },
            { title: "4단계: G채널 연산", desc: "필터의 G부분 × 입력 G채널" },
            { title: "5단계: B채널 연산", desc: "필터의 B부분 × 입력 B채널" },
            { title: "6단계: 특성맵 생성", desc: "필터가 슬라이딩하며 전체 특성맵(Feature Map)을 생성합니다" }
        ];

        let currentStep = 0;
        let currentSlidePos = 0; // 슬라이딩 위치 (0-3)

        // 합성곱 계산 함수
        function computeConv(input, filter, startRow, startCol) {
            let sum = 0;
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    sum += input[startRow + i][startCol + j] * filter[i][j];
                }
            }
            return sum;
        }

        // 전체 특성맵 계산
        function computeFeatureMap() {
            const featureMap = [];
            for (let row = 0; row < 2; row++) {
                const rowValues = [];
                for (let col = 0; col < 2; col++) {
                    const rVal = computeConv(inputR, filterR, row, col);
                    const gVal = computeConv(inputG, filterG, row, col);
                    const bVal = computeConv(inputB, filterB, row, col);
                    rowValues.push(rVal + gVal + bVal + bias);
                }
                featureMap.push(rowValues);
            }
            return featureMap;
        }

        // 특정 위치의 상세 계산
        function getDetailedCalc(row, col) {
            const rVal = computeConv(inputR, filterR, row, col);
            const gVal = computeConv(inputG, filterG, row, col);
            const bVal = computeConv(inputB, filterB, row, col);
            return { r: rVal, g: gVal, b: bVal, total: rVal + gVal + bVal + bias };
        }

        function createMatrix(data, color, title, size = 'normal', highlightArea = null) {
            const cellSize = size === 'small' ? 'w-10 h-10 text-xs' : 'w-12 h-12 text-sm';
            const bgColors = {
                red: 'bg-red-200',
                green: 'bg-green-200',
                blue: 'bg-blue-200',
                yellow: 'bg-yellow-200',
                gray: 'bg-gray-200'
            };
            const highlightColors = {
                red: 'bg-red-400',
                green: 'bg-green-400',
                blue: 'bg-blue-400',
                yellow: 'bg-yellow-400'
            };
            const titleColors = {
                red: '#dc2626',
                green: '#16a34a',
                blue: '#2563eb',
                yellow: '#ca8a04',
                gray: '#374151'
            };

            let html = `<div class="flex flex-col items-center">
                <div class="text-sm font-bold mb-1" style="color: ${titleColors[color]}">${title}</div>
                <div class="flex flex-col gap-0.5">`;
            
            data.forEach((row, i) => {
                html += `<div class="flex gap-0.5">`;
                row.forEach((val, j) => {
                    let isHighlighted = false;
                    if (highlightArea) {
                        const {startRow, startCol, size: areaSize} = highlightArea;
                        isHighlighted = i >= startRow && i < startRow + areaSize && 
                                       j >= startCol && j < startCol + areaSize;
                    }
                    const bgColor = isHighlighted ? highlightColors[color] : bgColors[color];
                    html += `<div class="${cellSize} ${bgColor} ${isHighlighted ? 'highlight' : ''} border border-gray-400 flex items-center justify-center font-mono rounded cell">${val}</div>`;
                });
                html += `</div>`;
            });
            
            html += `</div></div>`;
            return html;
        }

        function createFeatureMapWithHighlight(featureMap, highlightPos = null) {
            let html = `<div class="flex flex-col items-center">
                <div class="text-sm font-bold mb-1 text-yellow-700">특성맵 (2×2)</div>
                <div class="flex flex-col gap-1">`;
            
            featureMap.forEach((row, i) => {
                html += `<div class="flex gap-1">`;
                row.forEach((val, j) => {
                    const posIndex = i * 2 + j;
                    const isHighlighted = highlightPos === posIndex;
                    const bgColor = isHighlighted ? 'bg-yellow-400' : 'bg-yellow-200';
                    html += `<div onclick="setSlidePos(${posIndex})" class="w-16 h-16 ${bgColor} ${isHighlighted ? 'highlight ring-2 ring-yellow-600' : ''} border-2 border-yellow-500 flex items-center justify-center font-mono rounded-lg text-lg font-bold cursor-pointer hover:bg-yellow-300 transition-all">${val}</div>`;
                });
                html += `</div>`;
            });
            
            html += `</div></div>`;
            return html;
        }

        function setStep(step) {
            currentStep = step;
            currentSlidePos = 0;
            
            // 버튼 스타일 업데이트
            document.querySelectorAll('.step-btn').forEach((btn, i) => {
                if (i === step) {
                    btn.className = 'step-btn px-3 py-2 rounded-lg text-sm font-medium bg-indigo-600 text-white shadow-lg';
                } else {
                    btn.className = 'step-btn px-3 py-2 rounded-lg text-sm font-medium bg-white text-gray-600 hover:bg-indigo-100';
                }
            });

            // 제목과 설명 업데이트
            document.getElementById('stepTitle').textContent = steps[step].title;
            document.getElementById('stepDesc').textContent = steps[step].desc;

            // 메인 콘텐츠 렌더링
            renderContent(step);
        }

        function setSlidePos(pos) {
            currentSlidePos = pos;
            renderContent(5);
        }

        function renderContent(step) {
            const container = document.getElementById('mainContent');
            let html = '';

            switch(step) {
                case 0: // RGB 입력
                    html = `
                        <div class="flex flex-col items-center">
                            <h3 class="text-lg font-bold mb-4 text-gray-700">RGB 3채널 입력 이미지 (4×4×3)</h3>
                            <div class="flex gap-6 items-end flex-wrap justify-center">
                                ${createMatrix(inputR, 'red', 'R 채널')}
                                ${createMatrix(inputG, 'green', 'G 채널')}
                                ${createMatrix(inputB, 'blue', 'B 채널')}
                            </div>
                            <div class="mt-4 p-3 bg-yellow-50 rounded-lg border border-yellow-200 max-w-lg">
                                <p class="text-sm text-yellow-800">
                                    💡 RGB 이미지는 Red, Green, Blue 3개의 채널로 구성됩니다. 각 채널은 0-255 값을 가집니다.
                                </p>
                            </div>
                        </div>`;
                    break;

                case 1: // 3D 필터
                    html = `
                        <div class="flex flex-col items-center">
                            <h3 class="text-lg font-bold mb-4 text-gray-700">3×3×3 크기의 필터 (입력 채널 수와 동일)</h3>
                            <div class="flex gap-6 items-end flex-wrap justify-center">
                                ${createMatrix(filterR, 'red', '필터 R', 'small')}
                                ${createMatrix(filterG, 'green', '필터 G', 'small')}
                                ${createMatrix(filterB, 'blue', '필터 B', 'small')}
                            </div>
                            <div class="mt-4 flex items-center gap-2 p-3 bg-purple-50 rounded-lg border border-purple-200">
                                <span class="font-bold text-purple-700">Bias:</span>
                                <span class="bg-purple-200 px-3 py-1 rounded font-mono">${bias}</span>
                            </div>
                            <div class="mt-4 p-3 bg-yellow-50 rounded-lg border border-yellow-200 max-w-lg">
                                <p class="text-sm text-yellow-800">
                                    💡 <strong>핵심!</strong> 필터의 깊이(3)는 입력 채널 수(3)와 반드시 같아야 합니다.
                                </p>
                            </div>
                        </div>`;
                    break;

                case 2: // R 채널 연산
                    html = `
                        <div class="flex flex-col items-center">
                            <h3 class="text-lg font-bold mb-4 text-red-600">R 채널 합성곱 연산</h3>
                            <div class="flex items-center gap-4 flex-wrap justify-center">
                                ${createMatrix(inputR, 'red', '입력 R', 'normal', {startRow: 0, startCol: 0, size: 3})}
                                <span class="text-2xl font-bold">×</span>
                                ${createMatrix(filterR, 'red', '필터 R', 'small')}
                                <span class="text-2xl font-bold">=</span>
                                <div class="flex flex-col items-center">
                                    <div class="text-sm font-bold text-red-600 mb-1">결과 R</div>
                                    <div class="bg-red-100 border-2 border-red-400 rounded-lg p-4 font-mono text-2xl font-bold">-45</div>
                                </div>
                            </div>
                            <div class="mt-4 p-3 bg-red-50 rounded-lg border border-red-200 max-w-2xl">
                                <p class="text-sm text-red-800 font-mono text-center">
                                    (120×1 + 130×0 + 125×(-1)) + (135×1 + 145×0 + 150×(-1)) + (140×1 + 155×0 + 160×(-1)) = <strong>-45</strong>
                                </p>
                            </div>
                        </div>`;
                    break;

                case 3: // G 채널 연산
                    html = `
                        <div class="flex flex-col items-center">
                            <h3 class="text-lg font-bold mb-4 text-green-600">G 채널 합성곱 연산</h3>
                            <div class="flex items-center gap-4 flex-wrap justify-center">
                                ${createMatrix(inputG, 'green', '입력 G', 'normal', {startRow: 0, startCol: 0, size: 3})}
                                <span class="text-2xl font-bold">×</span>
                                ${createMatrix(filterG, 'green', '필터 G', 'small')}
                                <span class="text-2xl font-bold">=</span>
                                <div class="flex flex-col items-center">
                                    <div class="text-sm font-bold text-green-600 mb-1">결과 G</div>
                                    <div class="bg-green-100 border-2 border-green-400 rounded-lg p-4 font-mono text-2xl font-bold">-50</div>
                                </div>
                            </div>
                            <div class="mt-4 p-3 bg-green-50 rounded-lg border border-green-200 max-w-2xl">
                                <p class="text-sm text-green-800 font-mono text-center">
                                    (80×1 + 85×0 + 90×(-1)) + (95×2 + 100×0 + 105×(-2)) + (100×1 + 110×0 + 115×(-1)) = <strong>-50</strong>
                                </p>
                            </div>
                        </div>`;
                    break;

                case 4: // B 채널 연산
                    html = `
                        <div class="flex flex-col items-center">
                            <h3 class="text-lg font-bold mb-4 text-blue-600">B 채널 합성곱 연산</h3>
                            <div class="flex items-center gap-4 flex-wrap justify-center">
                                ${createMatrix(inputB, 'blue', '입력 B', 'normal', {startRow: 0, startCol: 0, size: 3})}
                                <span class="text-2xl font-bold">×</span>
                                ${createMatrix(filterB, 'blue', '필터 B', 'small')}
                                <span class="text-2xl font-bold">=</span>
                                <div class="flex flex-col items-center">
                                    <div class="text-sm font-bold text-blue-600 mb-1">결과 B</div>
                                    <div class="bg-blue-100 border-2 border-blue-400 rounded-lg p-4 font-mono text-2xl font-bold">-5</div>
                                </div>
                            </div>
                            <div class="mt-4 p-3 bg-blue-50 rounded-lg border border-blue-200 max-w-2xl">
                                <p class="text-sm text-blue-800 font-mono text-center">
                                    (55×1) + (65×1 + 70×(-4) + 75×1) + (80×1) = <strong>-5</strong>
                                </p>
                            </div>
                        </div>`;
                    break;

                case 5: // 특성맵 생성
                    const featureMap = computeFeatureMap();
                    const slideRow = Math.floor(currentSlidePos / 2);
                    const slideCol = currentSlidePos % 2;
                    const calc = getDetailedCalc(slideRow, slideCol);
                    const posLabels = ['좌상단 (0,0)', '우상단 (0,1)', '좌하단 (1,0)', '우하단 (1,1)'];
                    
                    html = `
                        <div class="flex flex-col items-center">
                            <h3 class="text-lg font-bold mb-4 text-purple-600">🎬 필터 슬라이딩으로 특성맵 생성</h3>
                            
                            <!-- 슬라이딩 위치 선택 버튼 -->
                            <div class="flex gap-2 mb-4">
                                ${[0,1,2,3].map(i => `
                                    <button onclick="setSlidePos(${i})" class="px-3 py-1 rounded ${currentSlidePos === i ? 'bg-yellow-500 text-white' : 'bg-gray-200 hover:bg-gray-300'} text-sm font-medium transition-all">
                                        위치 ${i+1}
                                    </button>
                                `).join('')}
                            </div>
                            
                            <div class="flex gap-8 items-start flex-wrap justify-center">
                                <!-- 입력 이미지들 (하이라이트 영역 표시) -->
                                <div class="flex flex-col items-center">
                                    <div class="text-sm font-bold mb-2 text-gray-600">입력 (슬라이딩 위치: ${posLabels[currentSlidePos]})</div>
                                    <div class="flex gap-3">
                                        ${createMatrix(inputR, 'red', 'R', 'normal', {startRow: slideRow, startCol: slideCol, size: 3})}
                                        ${createMatrix(inputG, 'green', 'G', 'normal', {startRow: slideRow, startCol: slideCol, size: 3})}
                                        ${createMatrix(inputB, 'blue', 'B', 'normal', {startRow: slideRow, startCol: slideCol, size: 3})}
                                    </div>
                                </div>
                                
                                <div class="text-4xl text-gray-400 self-center">→</div>
                                
                                <!-- 특성맵 -->
                                <div class="flex flex-col items-center">
                                    <div class="text-sm font-bold mb-2 text-gray-600">출력 특성맵</div>
                                    ${createFeatureMapWithHighlight(featureMap, currentSlidePos)}
                                    <div class="text-xs text-gray-500 mt-1">클릭하여 위치 선택</div>
                                </div>
                            </div>
                            
                            <!-- 선택된 위치의 계산 과정 -->
                            <div class="mt-6 p-4 bg-gradient-to-r from-purple-50 to-indigo-50 rounded-lg border border-purple-200 max-w-2xl">
                                <p class="text-center text-purple-800 font-bold mb-3">📍 ${posLabels[currentSlidePos]} 계산 과정</p>
                                <div class="flex items-center gap-2 justify-center flex-wrap">
                                    <div class="bg-red-100 border-2 border-red-400 rounded px-3 py-1 font-mono text-center">
                                        <div class="text-xs text-red-600">R</div>
                                        <div class="font-bold">${calc.r}</div>
                                    </div>
                                    <span class="text-xl font-bold text-gray-600">+</span>
                                    <div class="bg-green-100 border-2 border-green-400 rounded px-3 py-1 font-mono text-center">
                                        <div class="text-xs text-green-600">G</div>
                                        <div class="font-bold">${calc.g}</div>
                                    </div>
                                    <span class="text-xl font-bold text-gray-600">+</span>
                                    <div class="bg-blue-100 border-2 border-blue-400 rounded px-3 py-1 font-mono text-center">
                                        <div class="text-xs text-blue-600">B</div>
                                        <div class="font-bold">${calc.b}</div>
                                    </div>
                                    <span class="text-xl font-bold text-gray-600">+</span>
                                    <div class="bg-purple-100 border-2 border-purple-400 rounded px-3 py-1 font-mono text-center">
                                        <div class="text-xs text-purple-600">bias</div>
                                        <div class="font-bold">${bias}</div>
                                    </div>
                                    <span class="text-xl font-bold text-gray-600">=</span>
                                    <div class="bg-yellow-300 border-2 border-yellow-600 rounded-lg px-4 py-2 font-mono text-xl font-bold">
                                        ${calc.total}
                                    </div>
                                </div>
                            </div>
                            
                            <!-- 전체 특성맵 요약 -->
                            <div class="mt-4 p-4 bg-yellow-50 rounded-lg border border-yellow-300 max-w-xl">
                                <p class="text-center text-yellow-800 font-bold mb-2">🎯 완성된 특성맵</p>
                                <div class="flex justify-center gap-4 items-center">
                                    <div class="text-center">
                                        <div class="text-xs text-gray-500 mb-1">4×4×3 입력</div>
                                        <div class="bg-gray-200 rounded p-2 font-mono text-sm">RGB</div>
                                    </div>
                                    <div class="text-2xl">→</div>
                                    <div class="text-center">
                                        <div class="text-xs text-gray-500 mb-1">3×3×3 필터</div>
                                        <div class="bg-indigo-200 rounded p-2 font-mono text-sm">Conv</div>
                                    </div>
                                    <div class="text-2xl">→</div>
                                    <div class="text-center">
                                        <div class="text-xs text-gray-500 mb-1">2×2×1 출력</div>
                                        <div class="grid grid-cols-2 gap-0.5 bg-yellow-300 rounded p-1">
                                            ${featureMap.flat().map(v => `<div class="w-8 h-8 bg-yellow-200 rounded flex items-center justify-center text-xs font-mono font-bold">${v}</div>`).join('')}
                                        </div>
                                    </div>
                                </div>
                                <p class="text-center text-sm text-yellow-700 mt-2">
                                    💡 필터를 N개 사용하면 → 2×2×<strong>N</strong> 특성맵 생성
                                </p>
                            </div>
                        </div>`;
                    break;
            }

            container.innerHTML = html;
        }

        // 초기 렌더링
        setStep(0);
    </script>
</body>
</html>
